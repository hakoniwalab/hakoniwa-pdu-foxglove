name: Validate Windows x64

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  windows-x64:
    # Native Windows support was reproduced and documented against Visual Studio 2022.
    # Pin the CI image so compiler upgrades in windows-latest do not silently change
    # the supported baseline.
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows dependencies
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "vcpkg-install.log"
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-asio:x64-windows fastcdr:x64-windows *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content $log -Tail 120
            exit $code
          }
          Write-Host "vcpkg dependencies installed"

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-win -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DHAKO_PDU_FOXGLOVE_BUILD_TESTS=ON `
            -DHAKO_PDU_FOXGLOVE_BUILD_EXAMPLES=ON

      - name: Build
        shell: pwsh
        run: |
          $log = Join-Path $env:RUNNER_TEMP "cmake-build.log"
          cmake --build build-win --config Release --parallel *> $log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Write-Host "Build failed; last 160 lines follow:"
            Get-Content $log -Tail 160
            exit $code
          }
          Get-Content $log -Tail 20

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-cmake-build-log
          path: ${{ runner.temp }}/cmake-build.log
          if-no-files-found: ignore

      - name: Run tests
        shell: pwsh
        run: |
          ctest --test-dir build-win -C Release --output-on-failure

      - name: Run publisher smoke
        shell: pwsh
        run: |
          ./tools/run_windows_smoke.ps1 `
            -BuildDir build-win `
            -Configuration Release `
            -VcpkgRoot "$env:VCPKG_INSTALLATION_ROOT" `
            -SkipConfigure `
            -SkipBuild
