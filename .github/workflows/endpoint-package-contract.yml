name: Endpoint Package Contract

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE*"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout Foxglove adapter
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ libboost-dev

      - name: Build and install Core-free Endpoint package
        run: |
          git clone --quiet https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF \
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --parallel 2
          cmake --install endpoint/build --config Release --prefix "${GITHUB_WORKSPACE}/endpoint-install"

      - name: Configure Foxglove against installed Endpoint
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_FOXGLOVE_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_FOXGLOVE_BUILD_TESTS=ON \
            -DHAKO_PDU_FOXGLOVE_USE_BUNDLED_ENDPOINT=OFF

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - name: Checkout Foxglove adapter
        uses: actions/checkout@v4

      - name: Install prerequisites
        run: brew install cmake boost

      - name: Build and install Core-free Endpoint package
        run: |
          git clone --quiet https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF \
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF \
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --parallel 2
          cmake --install endpoint/build --config Release --prefix "${GITHUB_WORKSPACE}/endpoint-install"

      - name: Configure Foxglove against installed Endpoint
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${GITHUB_WORKSPACE}/endpoint-install" \
            -DHAKO_PDU_FOXGLOVE_BUILD_EXAMPLES=OFF \
            -DHAKO_PDU_FOXGLOVE_BUILD_TESTS=ON \
            -DHAKO_PDU_FOXGLOVE_USE_BUNDLED_ENDPOINT=OFF

      - name: Build and test
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure

  windows:
    name: Windows x64
    runs-on: windows-2025
    steps:
      - name: Checkout Foxglove adapter
        uses: actions/checkout@v4

      - name: Install Boost with vcpkg
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT\vcpkg.exe" install boost-asio:x64-windows boost-beast:x64-windows

      - name: Build and install Core-free Endpoint package
        shell: pwsh
        run: |
          git clone --quiet https://github.com/hakoniwalab/hakoniwa-pdu-endpoint.git endpoint
          cmake -S endpoint -B endpoint/build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_INSTALL_PREFIX="$env:GITHUB_WORKSPACE/endpoint-install" `
            -DHAKO_PDU_ENDPOINT_ENABLE_HAKONIWA_CORE=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TESTS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_EXAMPLES=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_TOOLS=OFF `
            -DHAKO_PDU_ENDPOINT_BUILD_BENCHMARKS=OFF `
            -DHAKO_PDU_ENDPOINT_INSTALL=ON
          cmake --build endpoint/build --config Release --parallel 2
          cmake --install endpoint/build --config Release --prefix "$env:GITHUB_WORKSPACE/endpoint-install"

      - name: Configure Foxglove against installed Endpoint
        shell: pwsh
        run: |
          cmake -S . -B build `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DVCPKG_TARGET_TRIPLET=x64-windows `
            -DCMAKE_PREFIX_PATH="$env:GITHUB_WORKSPACE/endpoint-install" `
            -DHAKO_PDU_FOXGLOVE_BUILD_EXAMPLES=OFF `
            -DHAKO_PDU_FOXGLOVE_BUILD_TESTS=ON `
            -DHAKO_PDU_FOXGLOVE_USE_BUNDLED_ENDPOINT=OFF

      - name: Build and test
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2
          ctest --test-dir build -C Release --output-on-failure
